<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noimageindex">
  <title>BAR Countdown Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg"></div>
  <div id="shade"></div>

  <main id="countdown">
    <h1>BAR Countdown Timer</h1>
    <div class="units">
      <div class="unit"><span id="days">--</span><label>days</label></div>
      <div class="unit"><span id="hours">--</span><label>hours</label></div>
      <div class="unit"><span id="minutes">--</span><label>minutes</label></div>
      <div class="unit"><span id="seconds">--</span><label>seconds</label></div>
    </div>
    <p class="when">Friday, January 15, 2027 &middot; 5:01 PM ET</p>
  </main>

  <main id="done" hidden>
    <h1>BAR O'CLOCK</h1>
  </main>

  <script src="app.js"></script>
</body>
</html>
